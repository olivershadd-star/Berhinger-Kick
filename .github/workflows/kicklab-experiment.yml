name: KICK Windows incremental base
on:
  push:
    branches: [main]
    paths:
      - 'experiments/kicklab/**'
      - 'CMakeLists.txt'
      - '.github/workflows/kicklab-experiment.yml'
  pull_request:
    paths:
      - 'experiments/kicklab/**'
      - 'CMakeLists.txt'
      - '.github/workflows/kicklab-experiment.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: experiments/kicklab
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure x64
        run: cmake -S ../.. -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test audio engine
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Smoke-test sample library UI
        shell: pwsh
        run: |
          $app = "build/incremental-port/Release/KickLab.exe"
          $process = Start-Process $app -ArgumentList "--smoke-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "KickLab UI exited with $($process.ExitCode)" }
          foreach ($category in "Kicks","Snares","Hats","Percussions","Basses","Pads","Leads","FX","Autres") {
            if (-not (Test-Path "build/incremental-port/Release/samples/$category")) { throw "Missing library category: $category" }
          }
      - name: Assemble prototype
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/KickLab | Out-Null
          Copy-Item build/incremental-port/Release/KickLab.exe,build/incremental-port/Release/KickLab-Test.exe dist/KickLab/
          Copy-Item demo-kit,source dist/KickLab/ -Recurse
          Copy-Item README.md,LIRE-MOI.html,NOTICES.txt,RESULTATS.txt,APERCU.png,APERCU-SAMPLE.png,APERCU-MASCHINE-PLUS.png,DEMO.wav dist/KickLab/
          Copy-Item source/LICENSE dist/KickLab/LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: KickLab-Windows-x64
          path: experiments/kicklab/dist/KickLab/
