name: KICK Lab Windows portable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build and publish
        required: true
        default: 0.10.1

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: experiments/kicklab
    steps:
      - uses: actions/checkout@v4

      - name: Configure x64
        run: cmake -S ../.. -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test audio engine
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Smoke-test Windows interface
        shell: pwsh
        run: |
          $app = "build/incremental-port/Release/KickLab.exe"
          $process = Start-Process $app -ArgumentList "--smoke-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "KickLab UI exited with $($process.ExitCode)" }

      - name: Assemble portable ZIP
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $folder = "dist/KickLab-Windows-x64-$version-preview"
          New-Item -ItemType Directory -Force "$folder/demo-kit","$folder/profiles" | Out-Null
          Copy-Item build/incremental-port/Release/KickLab.exe "$folder/"
          Copy-Item demo-kit/*.wav "$folder/demo-kit/"
          Copy-Item profiles/README.txt "$folder/profiles/"
          Copy-Item README.md,LIRE-MOI.html,NOTICES.txt,RESULTATS.txt,APERCU-MASCHINE-PLUS.png "$folder/"
          Copy-Item source/LICENSE "$folder/LICENSE"
          Compress-Archive -Path $folder -DestinationPath "dist/KickLab-Windows-x64-$version-preview.zip" -Force

      - name: Publish public preview
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}-preview
          name: KICK Lab ${{ inputs.version }} — Windows portable preview
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Windows x64 portable preview built and tested by GitHub Actions.

            This preview rebuilds the Windows surface around the Maschine+ layout
            while retaining the stable AudIO engine, dual KICK screens, Pad
            Edit, ADSR, four insert slots and 31 Airwindows effects.

            Version 0.10.1 adds WAV export for the active A-H block. The offline
            renderer writes its exact musical length as stereo 48 kHz / 24-bit
            PCM through the actual track mixer, pad editing and insert effects.
            Version 0.10.0 adds safe New/Open/Save/Save As project commands, a
            functional Track Mutes page and automatic two-screen display for
            effects with more than four parameters. The original Airwindows
            catalog gains PurestGain, EveryTrim, GlitchShifter, TremoSquare and
            Fracture. The Maschine-style surface is rebalanced: display B and
            the 16 pads align, left commands are compact, nine blank future slots
            mirror them on the right, and KICK / ANKS Labs / Master share one
            dark technological panel. MIDI mappings remain portable in profiles.
            The Maschine 4D encoder now owns its CC exclusively and continues
            navigating at absolute endpoints 0/127, preventing accidental
            Browser parent-folder actions from legacy duplicate mappings.
            A-H are now eight linked kit/pattern blocks: each keeps independent
            samples, steps, length and sequence settings. Changes requested
            during playback occur at the current pattern boundary without
            stopping transport. Duplicate followed by A-H copies a pattern for
            variation editing.

            Extract the complete ZIP before launching KickLab.exe.
          files: experiments/kicklab/dist/KickLab-Windows-x64-${{ inputs.version }}-preview.zip
