name: KICK Lab Windows portable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build and publish
        required: true
        default: 0.21.2

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: experiments/kicklab
    steps:
      - uses: actions/checkout@v4

      - name: Configure x64
        run: cmake -S ../.. -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test audio engine
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Smoke-test Windows interface
        shell: pwsh
        run: |
          $app = "build/incremental-port/Release/KickLab.exe"
          $process = Start-Process $app -ArgumentList "--smoke-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "KickLab UI exited with $($process.ExitCode)" }

      - name: Assemble portable ZIP
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $folder = "dist/KickLab-Windows-x64-$version-preview"
          New-Item -ItemType Directory -Force "$folder/demo-kit","$folder/profiles","$folder/kits/User","$folder/appearance" | Out-Null
          Copy-Item build/incremental-port/Release/KickLab.exe "$folder/"
          Copy-Item demo-kit/*.wav "$folder/demo-kit/"
          Copy-Item profiles/README.txt "$folder/profiles/"
          Copy-Item README.md,LIRE-MOI.html,NOTICES.txt,RESULTATS.txt,APERCU-MASCHINE-PLUS.png "$folder/"
          Copy-Item source/LICENSE "$folder/LICENSE"
          Compress-Archive -Path $folder -DestinationPath "dist/KickLab-Windows-x64-$version-preview.zip" -Force

      - name: Publish public preview
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}-preview
          name: KICK Lab ${{ inputs.version }} — Windows portable preview
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Windows x64 portable preview built and tested by GitHub Actions.

            This preview rebuilds the Windows surface around the Maschine+ layout
            while retaining the stable AudIO engine, dual KICK screens, Pad
            Edit, ADSR, four insert slots and 31 Airwindows effects.

            Version 0.21.2 corrects and verifies the complete meter path. Track
            Mixer restores exact 0-100% control values and displays a separate
            measured peak in dB with a fluid meter and a true 0 dB marker.
            Master now distinguishes MIX before its fader, PRE before the
            limiter and final OUT, while showing its setting as percentage and
            dB. Red means strictly above 0 dB, never exactly 0 dB. The hidden
            AudIO design-output startup ramp is forced to unity before playback,
            so the bus and track meters agree from the first hit.

            Version 0.21.1 hardens the Windows mouse dispatcher and replaces
            the former launch-only smoke check with real clicks across KICK,
            Pad Mode, pads, SEQ, Drum/Keyboard steps and A-H patterns.

            Version 0.21.0 restores the full 16-track by 16-step sequencer as
            a second view of the same KICK surface. MENU, KICK and SEQ switch
            between the shared displays and the normal pad or sequencer area.
            Drum rows edit the sixteen pad tracks; Keyboard rows edit the
            sixteen mapped notes. Mouse edits, quantized live REC, Maschine+
            pads and the computer keyboard all write the same active A-H
            pattern. Patterns can contain one to four bars, with an independent
            edit-page selector that remains usable during play and pause.

            Version 0.20.0 widens and balances the two independent KICK displays,
            adds a dedicated MENU key that restores both displays, and rebuilds
            the right column as three clear identity, macro/control and Master
            blocks. Eight macros and four push buttons are reserved visibly for
            later assignments. Appearance is now portable: Settings can import
            a PNG/JPG/BMP wallpaper and choose background, hardware-button and
            resting-pad RGB colours. The image and KickLab.kicktheme are stored
            in the appearance folder beside the executable. Audio, project,
            kit and MIDI formats are unchanged.

            Version 0.19.1 corrects the complete gain structure. The hidden
            fixed -6 dB attenuation and the destructive hard clip are removed.
            Master now reaches a real 0 dB, followed by a safety limiter with
            a -1 dBFS sample-peak ceiling shared by live playback and 24-bit
            WAV export. The Master meter separates output level and gain
            reduction. Track Mixer now draws a fader and a pre-Master peak
            meter for each of the sixteen tracks, so the source of an overload
            can be reduced before it reaches the bus. The project and kit file
            formats remain KICKLAB 14 and KICKKIT 4.

            Version 0.19.0 completes KICK's standalone edit workflow with
            Copy Pad, Delete Pad and Erase Notes. Copy Pad duplicates all four
            sample layers, Pad Edit settings and insert effects inside the
            active Program without copying pattern events. Delete Pad clears
            the selected Program pad while preserving every pattern. Erase
            Notes targets a sequence, drum track and musical time range, or
            the melodic lane. ERASE opens both editors together; Shift +
            Duplicate does the same while normal Duplicate still copies a
            pattern to A-H. Mouse, keyboard, Q-Links, encoder and Maschine+
            pads share the same two-screen workflow. No project format change
            is required: KICKLAB 14 and KICKKIT 4 remain current.

            Version 0.18.0 ports KICK's original Color Editor as Program data.
            The two-screen editor assigns any of the eighteen KICK colours to
            one pad or all sixteen pads, and exposes the original Empty Pad,
            Pad Off and Pad On (Off/Velocity/Full) display modes. Menu item 5
            is restored to List Edit and menu item 9 opens Color Editor, as in
            the published KICK menu. KICKLAB 14 and KICKKIT 4 preserve the
            Program colour modes; every older project and kit remains readable.

            Version 0.17.0 ports the original KICK List Edit note table onto
            the dual-screen Windows surface. Screen A lists every drum and
            melodic event in musical time and edits Time, Pad/Note and row
            selection. Screen B edits Length, Velocity, Probability and
            Ratchet. Events can be inserted, deleted and moved without losing
            their metadata; occupied destinations are protected. List Edit is
            available from menu item 5 or Shift + Events and uses the existing
            KICKLAB 13 event data without another format break.

            Version 0.16.0 ports the original KICK Program-level Pad Mixer and
            Pad Mutes as a separate layer from the sequence Track Mixer. Shift
            + Mixer opens pad Level/Pan across pages 1-8 and 9-16; Shift + Mute
            opens the sixteen Program mutes. Pads in the same KICK mute/choke
            group follow together. The state belongs to the reusable Program,
            is audible in live playback and WAV export, and is preserved by
            KICKLAB 13 and KICKKIT 3 while all older formats remain readable.

            Version 0.15.0 ports the first complete KICK Events layer. Every
            drum or melodic step now owns velocity, probability, ratchet and
            note length. The EVENTS hardware command opens the contextual
            editor; pads select a step and Q-Links P1-P4 edit its four values.
            Live REC captures incoming MIDI velocity. KICKLAB 12 preserves the
            data and still reads all previous KICKLAB projects.

            Version 0.14.0 completes the first KICK Drum Program playback model:
            four layers per pad, Velocity/Cycle/Random layer selection, One Shot,
            Note On and Note Off play types, choke groups, reverse playback and
            eighteen pad colours. Pad Edit now exposes five hardware-style pages
            across either display, and Maschine pad velocity reaches the engine.
            KICKLAB 11 and KICKKIT 2 preserve all layer data while still reading
            previous projects and kits.

            Version 0.13.0 introduced the KICK Program model. Sixteen reusable
            Drum Programs own samples and pad settings while patterns only own
            musical events and reference a Program. The dual-screen Program
            Manager creates, duplicates, assigns and safely deletes Programs.
            KICKLAB 10 stores those links and migrates KICKLAB 1-9 projects.
            Pattern duplication preserves the destination Program.

            Version 0.12.0 adds standalone KICKKIT 1 Drum Program files. FILE
            can save or load the sixteen pads of the active A-H block without
            touching its pattern, tempo, Song or the other blocks. WAV files
            are never embedded: samples below the portable samples directory
            use relative paths, and a missing file aborts the load safely. The
            external kits/User directory starts empty.

            Version 0.11.1 adds tempo-aware Loop Sync with source BPM stored in
            KICKLAB 9 projects, a complete bidirectional Tempo page, audio-clock
            Note Repeat, melodic arpeggiation and triad Chords. Mixer always
            opens on tracks 1-8 and its second physical page addresses 9-16.
            Version 0.10.1 adds WAV export for the active A-H block. The offline
            renderer writes its exact musical length as stereo 48 kHz / 24-bit
            PCM through the actual track mixer, pad editing and insert effects.
            Version 0.10.0 adds safe New/Open/Save/Save As project commands, a
            functional Track Mutes page and automatic two-screen display for
            effects with more than four parameters. The original Airwindows
            catalog gains PurestGain, EveryTrim, GlitchShifter, TremoSquare and
            Fracture. The Maschine-style surface is rebalanced: display B and
            the 16 pads align, left commands are compact, nine blank future slots
            mirror them on the right, and KICK / ANKS Labs / Master share one
            dark technological panel. MIDI mappings remain portable in profiles.
            The Maschine 4D encoder now owns its CC exclusively and continues
            navigating at absolute endpoints 0/127, preventing accidental
            Browser parent-folder actions from legacy duplicate mappings.
            A-H are now eight linked kit/pattern blocks: each keeps independent
            samples, steps, length and sequence settings. Changes requested
            during playback occur at the current pattern boundary without
            stopping transport. Duplicate followed by A-H copies a pattern for
            variation editing.

            Extract the complete ZIP before launching KickLab.exe.
          files: experiments/kicklab/dist/KickLab-Windows-x64-${{ inputs.version }}-preview.zip
