name: Original KICK application — Windows integration build
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-application:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure original application with Windows adapters
        run: cmake -S . -B build-original -A x64 -DKICK_BUILD_ORIGINAL_REFERENCE=ON
      - name: Compile original Kick target
        run: cmake --build build-original --config Release
      - name: Assemble portable directory
        shell: pwsh
        run: |
          $source = "build-original/original-build"
          $portable = "portable/Kick-Windows"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item "$source/Kick.exe" "$portable/Kick.exe"
          foreach ($directory in @("assets", "templates", "demos")) {
            Copy-Item "$source/$directory" "$portable/$directory" -Recurse
          }
          foreach ($directory in @("samples", "projects", "logs", "prefs")) {
            New-Item -ItemType Directory -Force -Path "$portable/$directory" | Out-Null
          }
          Copy-Item "port/windows/LISEZ-MOI.txt" "$portable/LISEZ-MOI.txt"
          $hash = (Get-FileHash "$portable/Kick.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash *Kick.exe" | Set-Content "$portable/SHA256.txt"
      - name: Smoke-test original KICK process
        shell: pwsh
        run: |
          $portable = (Resolve-Path "portable/Kick-Windows").Path
          $process = Start-Process -FilePath "$portable/Kick.exe" -WorkingDirectory $portable -PassThru
          if (-not $process.WaitForInputIdle(15000)) {
            throw "Original KICK did not create an idle GUI message loop within 15 seconds."
          }
          Start-Sleep -Seconds 5
          $process.Refresh()
          if ($process.HasExited) {
            Write-Host "Kick exited during startup with code $($process.ExitCode)."
            Get-ChildItem "$portable/logs" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName }
            throw "Original KICK did not remain running."
          }
          if ($process.MainWindowHandle -eq [IntPtr]::Zero -or $process.MainWindowTitle -ne "Kick") {
            throw "Original KICK did not expose its expected main window."
          }
          if (-not $process.Responding) {
            throw "Original KICK main window is not responding."
          }
          Start-Sleep -Seconds 15
          $process.Refresh()
          if ($process.HasExited -or -not $process.Responding) {
            throw "Original KICK did not remain responsive for the complete startup check."
          }
          Stop-Process -Id $process.Id -Force
          $process.WaitForExit()
      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path portable/Kick-Windows -DestinationPath portable/Kick-Windows-0.3.3-preview.zip
      - name: Upload portable preview
        uses: actions/upload-artifact@v4
        with:
          name: Kick-Windows-0.3.3-preview
          path: portable/Kick-Windows-0.3.3-preview.zip
          if-no-files-found: error
      - name: Publish portable preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "portable/Kick-Windows-0.3.3-preview.zip"
          $notes = @"
          Première préversion technique portable du portage Windows de l'application KICK originale.

          Validé automatiquement sur Windows : compilation MSVC, édition de liens, assemblage des ressources et maintien du processus pendant 20 secondes. Les essais audio, visuels et fonctionnels complets restent à effectuer.
          "@
          if (gh release view "v0.3.3-preview" 2>$null) {
            gh release upload "v0.3.3-preview" $asset --clobber
            gh release edit "v0.3.3-preview" --target $env:GITHUB_SHA --title "KICK original Windows 0.3.3 — préversion" --notes $notes --prerelease
          } else {
            gh release create "v0.3.3-preview" $asset --target $env:GITHUB_SHA --title "KICK original Windows 0.3.3 — préversion" --notes $notes --prerelease
          }
      - name: Keep integration diagnostics even when compilation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-kick-windows-diagnostics
          path: |
            build-original/source-audit.json
            build-original/staging/port-changes.json
            build-original/original-build/CMakeFiles/CMakeConfigureLog.yaml
            portable/Kick-Windows/logs/**
